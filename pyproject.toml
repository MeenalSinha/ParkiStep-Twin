[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parkistep"
version = "0.1.0"
description = "ParkiStep Twin - Phase 1 data foundation + Phase 2 forecasting (research prototype, not a medical device)"
requires-python = ">=3.10"
dependencies = ["pandas>=2.2", "numpy>=1.26", "PyYAML>=6.0", "requests>=2.31", "matplotlib>=3.8", "scikit-learn>=1.4", "scipy>=1.11", "joblib>=1.3"]

[project.optional-dependencies]
parquet = ["pyarrow>=15"]
test = ["pytest>=8"]
dashboard = ["streamlit>=1.40", "plotly>=5.20"]

[project.scripts]
parkistep = "parkistep.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
