<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1080" viewBox="0 0 1400 1080">
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L10,6 L0,12 z" fill="#0A928B"/></marker><marker id="arrowGray" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L10,6 L0,12 z" fill="#53657A"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="700" y="52" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#142B4A">ParkiStep Twin — Phase 0 Architecture</text><text x="700" y="86" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#53657A">Forecast FoG onset from clinical context + past-only wearable movement windows</text><rect x="65" y="125" width="570" height="150" rx="18" fill="#E7F6F4" stroke="#0A928B" stroke-width="2"/><text x="350" y="158" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#0A928B">STREAM A  |  STATIC / HISTORICAL</text><text x="350" y="195" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#142B4A">FoG-STAR clinical_data.csv</text><text x="350" y="228" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#27364B">Demographics + available clinical assessments</text><text x="350" y="253" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#53657A">One record per participant; no invented labs/genetics</text><rect x="765" y="125" width="570" height="150" rx="18" fill="#F4F7FB" stroke="#142B4A" stroke-width="2"/><text x="1050" y="158" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#142B4A">STREAM B  |  DYNAMIC / WEARABLE</text><text x="1050" y="195" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#142B4A">FoG-STAR sensor_data.csv</text><text x="1050" y="228" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#27364B">4 IMUs • accelerometer + gyroscope • 60 Hz</text><text x="1050" y="253" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#53657A">Replay in timestamp order as simulated live data</text><path d="M350,275 L350,314" fill="none" stroke="#0A928B" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M1050,275 L1050,314" fill="none" stroke="#0A928B" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="65" y="314" width="570" height="120" rx="14" fill="#FFFFFF" stroke="#DCE5EF" stroke-width="2"/><text x="350" y="347" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#142B4A">Clinical feature pipeline</text><text x="350" y="379" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#27364B">Validate fields • encode/scale in training folds</text><text x="350" y="405" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#27364B">Link by subjectID; track missingness</text><rect x="765" y="314" width="570" height="120" rx="14" fill="#FFFFFF" stroke="#DCE5EF" stroke-width="2"/><text x="1050" y="347" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#142B4A">Causal sensor-window pipeline</text><text x="1050" y="379" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#27364B">Validate timestamps / gaps • trailing ~2 s window</text><text x="1050" y="405" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#27364B">Extract features using samples available at time t</text><path d="M350,434 L350,470" fill="none" stroke="#0A928B" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M1050,434 L1050,470" fill="none" stroke="#0A928B" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M350,470 L580,500" fill="none" stroke="#0A928B" stroke-width="4" stroke-linecap="round"/><path d="M1050,470 L820,500" fill="none" stroke="#0A928B" stroke-width="4" stroke-linecap="round"/><rect x="285" y="500" width="830" height="100" rx="16" fill="#F0EAFE" stroke="#9B87D5" stroke-width="2"/><text x="700" y="535" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#142B4A">FEATURE-LEVEL FUSION</text><text x="700" y="568" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#27364B">Clinical profile + current sensor features → one prediction row</text><path d="M700,600 L700,637" fill="none" stroke="#0A928B" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="285" y="637" width="830" height="108" rx="16" fill="#F4F7FB" stroke="#142B4A" stroke-width="2"/><text x="700" y="672" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#142B4A">EARLY-WARNING MODEL</text><text x="700" y="704" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#27364B">Primary candidate: P(FoG onset in the next 3 seconds)</text><text x="700" y="728" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#53657A">1 s and 5 s are sensitivity analyses, not promised warning times</text><path d="M700,745 L700,780" fill="none" stroke="#0A928B" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="285" y="780" width="830" height="90" rx="16" fill="#E7F6F4" stroke="#0A928B" stroke-width="2"/><text x="700" y="814" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#0A928B">DIGITAL TWIN STATE + ALERT MANAGER</text><text x="700" y="844" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#27364B">Profile • latest window • risk • signal quality • alert history</text><path d="M500,870 L360,912" fill="none" stroke="#0A928B" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M900,870 L1040,912" fill="none" stroke="#0A928B" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="65" y="912" width="570" height="112" rx="16" fill="#FFFFFF" stroke="#0A928B" stroke-width="2"/><text x="350" y="945" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#142B4A">CLINICIAN DASHBOARD</text><text x="350" y="975" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#27364B">Patient profile • signal replay • forecast • evidence</text><text x="350" y="1001" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#53657A">Predicted and observed events clearly distinguished</text><rect x="765" y="912" width="570" height="112" rx="16" fill="#FEF3C7" stroke="#D6A43A" stroke-width="2"/><text x="1050" y="945" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#142B4A">POST-HOC EVALUATION ONLY</text><text x="1050" y="975" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#27364B">Expert FoG annotations compare against alerts</text><text x="1050" y="1001" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#53657A">Labels must never be predictor inputs at inference time</text><text x="700" y="1056" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#53657A">Research prototype only • not a diagnostic or treatment system</text></svg>