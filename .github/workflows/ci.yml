name: ParkiStep Twin CI & Release Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_real_data_tests:
        description: 'Run real data and model artifact integration tests'
        required: false
        default: 'false'
        type: boolean

jobs:
  offline-ci:
    name: Offline Core CI (Lint, Config, Fixtures)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff pyyaml

      - name: Validate configuration syntax
        run: |
          python -c "import yaml, glob; [yaml.safe_load(open(f, encoding='utf-8')) for f in glob.glob('configs/*.yaml')]; print('Configs valid!')"

      - name: Run code quality checks (Ruff)
        run: |
          ruff check src/ app/ configs/ --ignore E501 || true

      - name: Run secret and credential scan
        run: |
          python -c "
          import re, os
          patterns = [re.compile(r'-----BEGIN (?:RSA |EC )?PRIVATE KEY-----'), re.compile(r'(?:api[_-]?key|secret|password|access[_-]?token)\s*[:=]\s*[\'\"][A-Za-z0-9_\-]{16,}[\'\"]', re.I)]
          violations = []
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in ('.git', '__pycache__', '.pytest_cache')]
              for fn in files:
                  if fn.endswith(('.py', '.yaml', '.yml', '.json', '.md', '.toml')):
                      txt = open(os.path.join(root, fn), encoding='utf-8', errors='ignore').read()
                      if any(p.search(txt) for p in patterns):
                          violations.append(os.path.join(root, fn))
          if violations:
              raise SystemExit(f'Secrets detected in: {violations}')
          print('Clean: No secrets found.')
          "

      - name: Run offline unit tests (isolated fixtures)
        env:
          PYTHONPATH: src
          PARKISTEP_REQUIRE_REAL: "0"
        run: |
          pytest -q -p no:cacheprovider tests/test_config.py tests/test_acquisition.py tests/test_ingestion.py tests/test_quality.py tests/test_validation.py tests/test_phase2_config.py tests/test_phase2_alerts.py tests/test_phase2_events_windows.py tests/test_phase3_config.py tests/test_phase3_buffer.py tests/test_phase3_alerts.py tests/test_phase3_persistence.py tests/test_phase4_app.py tests/test_phase4_backend.py tests/test_phase6_repairs.py

      - name: Verify documentation relative links
        run: |
          python -c "
          import re, os
          txt = open('README.md', encoding='utf-8').read()
          links = re.findall(r'\[([^\]]+)\]\((?!http|mailto|#)([^\)]+)\)', txt)
          broken = [t.split('#')[0] for _, t in links if not os.path.exists(t.split('#')[0])]
          if broken:
              raise SystemExit(f'Broken relative links in README: {broken}')
          print(f'All {len(links)} relative links in README resolve.')
          "

  real-data-verification:
    name: Real Data & Model Verification
    runs-on: ubuntu-latest
    if: github.event.inputs.run_real_data_tests == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-lock.txt

      - name: Verify model artifacts
        env:
          PYTHONPATH: src
        run: |
          python scripts/p6_verify_artifacts.py

      - name: Run release preflight
        env:
          PYTHONPATH: src
        run: |
          python scripts/release_preflight.py --quick
